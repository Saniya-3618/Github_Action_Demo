
name: Scraper service

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: fhft
  cancel-in-progress: false

jobs:
  hpan:
    runs-on: [self-hosted, Windows, X64, uhbw]
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Python
        shell: powershell
        run: python --version

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r demo_projects/requirements.txt

      - name: Install Playwright Chromium
        if: ${{ hashFiles('requirements.txt') != '' }}
        shell: powershell
        run: |
          python -m playwright install chromium

      - name: Run scraper
        shell: powershell
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          # DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          # IMAP_HOST: ${{ secrets.IMAP_HOST }}
          # IMAP_PORT: ${{ secrets.IMAP_PORT }}
          # IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          # IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

          # HPAN_USERNAME: ${{ secrets.HPAN_USERNAME }}
          # HPAN_PASSWORD: ${{ secrets.HPAN_PASSWORD }}

          HEADLESS: "true"

        run: python demo_project/main_28_days_scraping.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpan-logs-${{ github.run_number }}
          path: demo_project/logs
          if-no-files-found: warn
          retention-days: 14
